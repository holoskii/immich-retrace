# Generic deployment: the viewer on http://127.0.0.1:8080 of this host. Settings come from .env
# (copy .env.example). The API key in .env reads the whole library and the viewer has no login of
# its own: publish it only behind a reverse proxy with authentication (DEPLOYMENT.md → Security).
services:
  immich-retrace:
    image: ghcr.io/holoskii/immich-retrace:latest   # or `build: .` in a clone, to build from source
    container_name: immich-retrace
    env_file:
      - .env
    ports:
      - 127.0.0.1:8080:8080
    restart: unless-stopped
    # To reach Immich by its container name (IMMICH_URL=http://immich-server:2283), join Immich's
    # network: uncomment below, with the name from `docker network ls` (usually immich_default).
    # Or add this service to Immich's own docker-compose.yml instead (README → Quick start).
#    networks:
#      - immich

# networks:
#   immich:
#     name: immich_default
#     external: true
